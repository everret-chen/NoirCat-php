name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 认证与权限
        - 论坛
        - 电子书
        - 学习成长
        - 公会与插件
        - 核心 / 基础设施
        - 文档 / 工具链
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: 安全影响
      options:
        - label: 该功能涉及用户输入处理（需要额外审计）
        - label: 该功能涉及文件上传或外部请求
        - label: 该功能涉及权限判定
