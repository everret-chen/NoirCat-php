name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, static analysis & dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, openssl, curl, fileinfo, zip, intl, gd
          coverage: none

      # The committed composer.lock was resolved through this registry (see CONTRIBUTING.md).
      # Configuring the same registry keeps the lock file's content hash consistent.
      - name: Align Composer registry with the lock file
        run: composer config -g repos.packagist composer https://mirrors.tencent.com/composer/

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Static analysis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Audit dependencies
        run: composer audit
