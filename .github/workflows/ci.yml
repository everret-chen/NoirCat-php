name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, static analysis & dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
          # Composer cache is handled by setup-php, so there is no second
          # third-party action (and no second action major to keep current).
          cache: composer

      # Makes a failing run self-diagnosing: the log shows the runtime and the
      # exact extension set before anything else can fail.
      - name: Diagnostics (runtime, extensions, Composer)
        run: |
          php -v
          php -m
          composer --version
          composer diagnose || true

      # The committed composer.lock was resolved through this registry (see CONTRIBUTING.md).
      # Configuring the same registry keeps the lock file's content hash consistent.
      - name: Align Composer registry with the lock file
        run: composer config -g repos.packagist composer https://mirrors.tencent.com/composer/

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Static analysis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Audit dependencies
        run: composer audit

  assets:
    name: Front end assets (Tailwind + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # The Blade views are useless if the stylesheet stops compiling: Tailwind
      # v4 rejects @apply of a class that is not a real utility, and no PHP test
      # can see that.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

  mysql:
    name: Tests against MySQL 8
    runs-on: ubuntu-latest

    # The suite runs on SQLite in the main job, which hides a whole class of
    # portability bugs (column lengths, collation, string-to-key coercion).
    # phpunit.xml only sets an environment variable when it is not already
    # defined, so exporting DB_* here switches the same suite to MySQL.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: noircat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: noircat_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_COLLATION: utf8mb4_0900_ai_ci
      DB_ENGINE: InnoDB
      DB_TIMEZONE: '+08:00'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl, gd, zip, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Align Composer registry with the lock file
        run: composer config -g repos.packagist composer https://mirrors.tencent.com/composer/

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the migrations against MySQL
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

      # Proves the suite above really talked to MySQL rather than to the
      # in-memory SQLite database configured in phpunit.xml.
      - name: Prove the schema landed in MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot -N -e \
            "select count(*) from information_schema.tables where table_schema='noircat_test'" \
            | tee /tmp/tables.txt
          test "$(cat /tmp/tables.txt)" -ge 15
