name: MySQL 8 report

# Runs the suite against a real MySQL 8 server and commits the transcript back
# into the branch, so the result is readable with `git fetch` instead of the
# Actions UI. Triggered by a change to the marker file below, which keeps it out
# of the ordinary dev/main push paths.
on:
  push:
    paths:
      - '.github/mysql-report-trigger'

permissions:
  contents: write

concurrency:
  group: mysql-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: MySQL 8 verification
    runs-on: ubuntu-latest
    # The run commits its report back to the branch it tested, so it is limited
    # to the dedicated branch: dev and main already run the MySQL job in ci.yml,
    # and a self-committing workflow there would race the next push.
    if: github.ref_name == 'ci/mysql-report'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: noircat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: noircat_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_COLLATION: utf8mb4_0900_ai_ci
      DB_ENGINE: InnoDB
      DB_TIMEZONE: '+08:00'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl, gd, zip, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Align Composer registry with the lock file
        run: composer config -g repos.packagist composer https://mirrors.tencent.com/composer/

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Every command is captured instead of aborting the job, so a failure still
      # produces a report that says what happened.
      - name: Migrate and test against MySQL 8
        id: run
        run: |
          set +e
          php artisan migrate:fresh --seed --force > /tmp/migrate.txt 2>&1
          echo "migrate_exit=$?" >> "$GITHUB_OUTPUT"
          php artisan test > /tmp/tests.txt 2>&1
          echo "test_exit=$?" >> "$GITHUB_OUTPUT"
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
                  echo $p->query("select version()")->fetchColumn();' > /tmp/server.txt 2>&1
          php -r 'echo implode(",", PDO::getAvailableDrivers());' > /tmp/drivers.txt 2>&1
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
                  echo $p->query("select count(*) from information_schema.tables where table_schema = \"noircat_test\"")->fetchColumn();' > /tmp/tables.txt 2>&1
          exit 0

      # The same three command groups ci.yml runs, so a red CI run can be
      # diagnosed from the committed transcript instead of the Actions UI.
      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: "Quality commands (mirrors the ci.yml quality job)"
        id: quality
        if: always()
        run: |
          set +e
          php artisan test > /tmp/quality-tests.txt 2>&1
          echo "quality_tests_exit=$?" >> "$GITHUB_OUTPUT"
          vendor/bin/phpstan analyse --no-progress > /tmp/quality-phpstan.txt 2>&1
          echo "phpstan_exit=$?" >> "$GITHUB_OUTPUT"
          composer audit > /tmp/quality-audit.txt 2>&1
          echo "audit_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Assets commands (mirrors the ci.yml assets job)"
        id: assets
        if: always()
        run: |
          set +e
          npm ci --no-audit --no-fund > /tmp/assets-ci.txt 2>&1
          echo "npm_ci_exit=$?" >> "$GITHUB_OUTPUT"
          npm run build > /tmp/assets-build.txt 2>&1
          echo "npm_build_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "MySQL client probe (mirrors the ci.yml prove-the-schema step)"
        id: dbcheck
        if: always()
        run: |
          set +e
          mysql --version > /tmp/mysql-cli.txt 2>&1
          echo "mysql_cli_exit=$?" >> "$GITHUB_OUTPUT"
          mysql -h 127.0.0.1 -uroot -proot -N -e \
            "select count(*) from information_schema.tables where table_schema='noircat_test'" \
            >> /tmp/mysql-cli.txt 2>&1
          echo "mysql_query_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write the report
        if: always()
        run: |
          mkdir -p docs/ci
          {
            echo "# MySQL 8 verification report"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| branch | \`${{ github.ref_name }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| date (UTC) | $(date -u +%FT%TZ) |"
            echo "| php | $(php -r 'echo PHP_VERSION;') |"
            echo "| pdo drivers | $(cat /tmp/drivers.txt) |"
            echo "| server version | $(cat /tmp/server.txt) |"
            echo "| tables in noircat_test | $(cat /tmp/tables.txt) |"
            echo "| migrate:fresh exit | ${{ steps.run.outputs.migrate_exit }} |"
            echo "| php artisan test (mysql) exit | ${{ steps.run.outputs.test_exit }} |"
            echo "| quality: test exit | ${{ steps.quality.outputs.quality_tests_exit }} |"
            echo "| quality: phpstan exit | ${{ steps.quality.outputs.phpstan_exit }} |"
            echo "| quality: composer audit exit | ${{ steps.quality.outputs.audit_exit }} |"
            echo "| assets: npm ci exit | ${{ steps.assets.outputs.npm_ci_exit }} |"
            echo "| assets: npm run build exit | ${{ steps.assets.outputs.npm_build_exit }} |"
            echo "| mysql cli version exit | ${{ steps.dbcheck.outputs.mysql_cli_exit }} |"
            echo "| mysql cli query exit | ${{ steps.dbcheck.outputs.mysql_query_exit }} |"
            echo
            echo "## migrate:fresh --seed --force"
            echo
            echo '```text'
            tail -n 40 /tmp/migrate.txt
            echo '```'
            echo
            echo "## php artisan test (against MySQL)"
            echo
            echo '```text'
            grep -E 'FAILED|Tests:' /tmp/tests.txt | head -n 40
            tail -n 25 /tmp/tests.txt
            echo '```'
            echo
            echo "## php artisan test (sqlite, as the quality job runs it)"
            echo
            echo '```text'
            grep -E 'FAILED|Tests:' /tmp/quality-tests.txt | head -n 40
            echo '```'
            echo
            echo "## phpstan"
            echo
            echo '```text'
            tail -n 20 /tmp/quality-phpstan.txt
            echo '```'
            echo
            echo "## composer audit"
            echo
            echo '```text'
            tail -n 20 /tmp/quality-audit.txt
            echo '```'
            echo
            echo "## npm ci"
            echo
            echo '```text'
            tail -n 25 /tmp/assets-ci.txt
            echo '```'
            echo
            echo "## npm run build"
            echo
            echo '```text'
            tail -n 25 /tmp/assets-build.txt
            echo '```'
            echo
            echo "## mysql client probe"
            echo
            echo '```text'
            tail -n 10 /tmp/mysql-cli.txt
            echo '```'
          } > docs/ci/mysql-8-report.md
          cat docs/ci/mysql-8-report.md

      - name: Commit the report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci/mysql-8-report.md
          git diff --cached --quiet && exit 0
          git commit -m "ci: record the MySQL 8 verification report"
          git push
