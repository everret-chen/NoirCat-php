version: 2

updates:
  # 只自动跟进 GitHub Actions 版本。
  #
  # Composer 依赖刻意不交给 Dependabot：本仓库的 composer.lock 是通过国内镜像
  # （见 CONTRIBUTING.md）解析的，而 Dependabot 会用它自己的官方注册表重写 dist 地址，
  # 导致国内本地安装失败。依赖更新请手动执行 `composer update` 并跑完整测试与审计。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
